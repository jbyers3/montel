<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Montell | Infrastructure observability</title><style>
*{box-sizing:border-box}body{margin:0;background:#0e1420;color:#e7edf7;font:15px system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:32px}header{border-bottom:1px solid #29364a;padding-bottom:24px}h1{font-size:34px;letter-spacing:.16em;margin:0}p{color:#a9b9cf}small{color:#a9b9cf}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px;margin:24px 0}.card{background:#182233;border:1px solid #2c3b51;border-radius:12px;padding:18px}.num{font-size:34px;font-weight:700}.healthy{color:#70dcb2}.warning{color:#f5c56c}.critical{color:#ff8c91}.unknown{color:#a9b9cf}select,input{background:#182233;color:#e7edf7;border:1px solid #41516a;border-radius:7px;padding:10px;margin:5px 8px 10px 0}table{width:100%;border-collapse:collapse;text-align:left}th,td{padding:13px;border-bottom:1px solid #29364a}th{color:#a9b9cf;font-size:12px;text-transform:uppercase}.scroll{overflow:auto}footer{margin-top:24px;color:#a9b9cf}h2{font-size:20px}</style><main><header><small>INFRASTRUCTURE INTELLIGENCE</small><h1>MONTELL</h1><p>Unified observability · Security posture · Database performance</p><small id="mode">Loading collection mode…</small></header><section class="cards" id="cards"></section><h2>Latest resource signals</h2><label>Source <select id="source"><option value="">All sources</option></select></label><label>Status <select id="status"><option value="">All statuses</option><option>healthy</option><option>warning</option><option>critical</option><option>unknown</option></select></label><label>Search <input id="search" placeholder="Resource or metric"></label><div class="scroll"><table><thead><tr><th>Source</th><th>Application</th><th>Resource</th><th>Metric</th><th>Value</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div><footer id="time"></footer></main><script>
const $=id=>document.getElementById(id);let data=[];function el(tag,text,cls){const e=document.createElement(tag);e.textContent=text;if(cls)e.className=cls;return e}function render(){const s=$('source').value,h=$('status').value,q=$('search').value.toLowerCase();$('rows').replaceChildren();for(const r of data.filter(r=>(!s||r.source===s)&&(!h||r.status===h)&&JSON.stringify(r).toLowerCase().includes(q))){const tr=el('tr','');for(const k of ['source','application','resource','metric'])tr.append(el('td',r[k]));tr.append(el('td',`${r.value} ${r.unit}`),el('td',r.status,r.status));$('rows').append(tr)}}async function load(){try{const res=await fetch('/api/signals');if(!res.ok)throw Error('request failed');data=await res.json();const health=await (await fetch("/api/collectors")).json();$("mode").textContent=health.mode+" mode | "+health.collectors.map(c=>c.source+": "+c.state).join(" · ");$("source").replaceChildren(el("option","All sources"));$("source").firstChild.value="";$("cards").replaceChildren();for(const s of [...new Set(data.map(r=>r.source))]){const o=el('option',s);o.value=s;$('source').append(o)}for(const s of ['all','healthy','warning','critical','unknown']){const c=el('div','','card');c.append(el('small',s.toUpperCase()),el('div',s==='all'?data.length:data.filter(r=>r.status===s).length,'num '+s));$('cards').append(c)}$('time').textContent='Sample timestamp: '+(data[0]?.observed_at||'none');render()}catch(e){$('time').textContent='Unable to load telemetry.'}}for(const k of ['source','status','search'])$(k).addEventListener('input',render);load();setInterval(load,15000);</script></html>
